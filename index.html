<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardianes de la educación | Trivia</title><style>
:root{--g:#123f32;--g2:#205b46;--cream:#fbf2df;--orange:#dc730c;--ink:#1d3028}*{box-sizing:border-box}body{margin:0;background:#eee4d1;color:var(--ink);font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:16px}header{background:linear-gradient(120deg,#103a2d,#25634b);color:white;border-radius:22px;padding:24px;position:relative;overflow:hidden;border-bottom:6px solid var(--orange)}header:after{content:'';position:absolute;right:-35px;top:-85px;width:230px;height:230px;border:25px solid #ffffff0d;border-radius:50%;pointer-events:none}h1,h2{font-family:Georgia,serif;margin:8px 0;line-height:1.16}h1{font-size:clamp(26px,4vw,40px)}h2{font-size:clamp(22px,3vw,30px)}p{line-height:1.5}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#ffd19a}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stat{flex:1;min-width:110px;background:#fffaf0;border:1px solid #d8c9ad;border-radius:13px;padding:12px}.stat strong{display:block;color:var(--g);font-size:24px;font-variant-numeric:tabular-nums}.track{height:10px;background:#d9d1bf;border-radius:8px;overflow:hidden}.bar{height:100%;width:0;background:var(--orange);transition:width .5s}.rounds{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.chip{font-size:12px;padding:7px 10px;border:1px solid #c4c5ab;border-radius:20px;background:#f9f4e9}.chip.active{background:var(--g);color:white}.chip.done{background:#d6e6d2}.panel{background:#fffaf0;border:1px solid #dcccad;border-radius:20px;padding:clamp(16px,3vw,28px);box-shadow:0 9px 22px #49381812;margin:14px 0}.intro{text-align:center}.art{width:150px;height:82px;float:right;margin:0 0 8px 14px;color:var(--g);animation:rise .45s ease}.art svg{width:100%;height:100%;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;background:#e6e6cc;border-radius:15px}.intro .art{float:none;width:220px;height:110px;margin:8px auto}.options{display:grid;gap:10px;clear:both;margin:20px 0 12px}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ac5300;outline-offset:3px}.option{display:flex;align-items:center;text-align:left;gap:12px;padding:13px;border:2px solid #ded3bc;background:white;color:var(--ink);border-radius:12px;transition:transform .15s,border .15s}.option:not(:disabled):hover{border-color:var(--g);transform:translateX(3px)}.letter{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:#e9eddf;font-weight:bold;color:var(--g)}.option.correct{border-color:#24764c;background:#e3f2e4}.option.wrong{border-color:#b85432;background:#fbe7dc}.option:disabled{cursor:default}.primary{border:0;border-radius:12px;background:var(--g);color:white;padding:13px 22px;font-weight:700}.primary:hover{background:var(--g2)}.secondary{border:1px solid var(--g);border-radius:12px;background:transparent;color:var(--g);padding:12px 20px;font-weight:700}.feedback{padding:14px;border-left:5px solid var(--orange);background:#f3e8cf;border-radius:8px;margin:15px 0;animation:rise .25s ease}.feedback.good{border-color:#24764c}.muted{color:#5b695e;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.animate{animation:rise .35s ease}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.confetti{position:fixed;top:-15px;width:9px;height:13px;pointer-events:none;animation:fall 1.6s ease-in forwards;z-index:5}@keyframes fall{to{transform:translateY(100vh) rotate(620deg);opacity:0}}.result{text-align:center}.big{font: bold 56px Georgia;color:var(--g)}.review{text-align:left;border-top:1px solid #d8c9ad;padding:10px 0}.hidden{display:none}footer{text-align:center;color:#546055;font-size:12px;padding:8px} @media(max-width:520px){main{padding:9px}.art{width:100px;height:65px}.stat{min-width:85px}.stat strong{font-size:20px}header{padding:18px}.panel{padding:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}}
</style></head><body><main><header><div class="eyebrow">Política educativa argentina · Unidad 2</div><h1>Guardianes de la educación</h1><div>Desafío de normativa y marcos legales contemporáneos</div></header><div id="hud" class="hidden"><div class="stats"><div class="stat">Puntaje<strong id="score">0</strong></div><div class="stat">Pregunta<strong id="count">1/20</strong></div><div class="stat">Racha<strong id="streak">0</strong></div></div><div class="track" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" id="track"><div id="bar" class="bar"></div></div><div class="rounds" id="rounds"></div></div><section id="screen" class="panel" aria-label="Juego"></section><footer>Actividad de repaso autoasistida · Basada en Unidad 2, material de Ariel G. Castet, UTN FRA. No registra notas en Moodle.</footer></main><script>
const raw=[[0, "¿Qué ley convocó al Congreso Pedagógico Nacional en 1984?", "Ley 23.144", ["Ley 24.195", "Ley 26.206", "Ley 24.521"], "La Ley 23.144 fue aprobada por unanimidad en ambas cámaras legislativas.", 2], [0, "¿Qué propósito tuvo el Congreso Pedagógico Nacional?", "Recoger opiniones y estudiar los problemas educativos", ["Eliminar la participación social", "Transferir todas las universidades a las provincias", "Reemplazar la educación pública por la privada"], "El Congreso buscó generar debate, valorar opiniones y analizar las dificultades de la educación.", 2], [0, "¿Cómo debía ser el currículum según los acuerdos del Congreso?", "Flexible, abierto e interdisciplinario", ["Uniforme y cerrado a las regiones", "Exclusivamente técnico", "Independiente del sistema nacional"], "Se propuso adaptar el currículum al contexto sociocultural regional sin perder la unidad nacional.", 3], [1, "¿Qué responsabilidades se trasladaron a las provincias durante la descentralización?", "Financieras y administrativas", ["Solo la emisión de títulos universitarios", "Exclusivamente la definición de contenidos nacionales", "Únicamente la investigación científica"], "El material describe un desplazamiento de responsabilidades financieras y administrativas hacia las jurisdicciones.", 6], [1, "¿Qué quedó centralizado en el Ministerio de Educación de la Nación?", "Los Contenidos Básicos Comunes y la orientación pedagógica general", ["La administración de todos los talleres escolares", "La contratación de cada docente provincial", "La totalidad de los servicios secundarios"], "La reforma combinó descentralización administrativa con centralización de orientaciones pedagógicas.", 5], [1, "¿Qué estructura reemplazó a la escuela primaria durante la reforma de los años 90?", "Educación General Básica (EGB)", ["Educación Polimodal", "Educación Superior", "Formación Profesional"], "La EGB extendía a nueve años la escolaridad básica obligatoria, según el apunte.", 5], [1, "¿Qué norma creó un sistema nacional de evaluación de la calidad y una red federal de formación docente continua?", "Ley Federal de Educación 24.195", ["Ley 23.144", "Ley 26.058", "Ley 24.521"], "El texto atribuye ambas medidas a la Ley Federal de Educación de 1993.", 6], [2, "¿Qué instituciones abarcó la Ley de Educación Superior 24.521?", "Instituciones superiores universitarias y no universitarias", ["Solo escuelas secundarias", "Solo universidades privadas", "Únicamente centros de formación profesional"], "La ley incorporó también a las instituciones terciarias de formación docente dentro del nivel superior.", 6], [2, "¿Qué norma se vincula con la recuperación de la escuela técnica en 2005?", "Ley 26.058", ["Ley 24.195", "Ley 23.144", "Ley 24.521"], "La Ley de Educación Técnico Profesional regula la educación técnica de nivel medio y superior no universitario y la formación profesional.", 9], [2, "Según el artículo 3 de la Ley 26.058, ¿qué representa la Educación Técnico Profesional?", "Un derecho de todo habitante de la Nación Argentina", ["Un beneficio exclusivo de trabajadores registrados", "Una actividad reservada a universidades", "Una formación exclusivamente tecnológica"], "El artículo la concibe como un derecho y contempla formación ética, ciudadana, científica, técnica y tecnológica.", 10], [3, "¿Qué ley fue derogada por la Ley de Educación Nacional 26.206?", "Ley Federal de Educación 24.195", ["Ley de Educación Superior 24.521", "Ley de Educación Técnico Profesional 26.058", "Ley 23.144 del Congreso Pedagógico"], "La Ley 26.206 reorganizó el sistema educativo nacional en 2006.", 11], [3, "¿Qué busca garantizar el artículo 15 de la Ley 26.206?", "La unidad del sistema y la validez nacional de títulos y certificados", ["La desaparición de las modalidades", "La autonomía absoluta de cada escuela", "La eliminación de la educación superior"], "El artículo establece una estructura unificada y la articulación entre niveles y modalidades.", 11], [3, "Una escuela adapta su propuesta a las particularidades del entorno rural. ¿Con qué modalidad se relaciona?", "Educación Rural", ["Educación Artística", "Educación en Contextos de Privación de Libertad", "Educación Superior"], "La Educación Rural es una de las modalidades enumeradas en el artículo 17.", 12], [3, "¿Quién autoriza, reconoce y supervisa los servicios educativos de gestión privada según el artículo 62?", "Las autoridades educativas jurisdiccionales", ["El Consejo de Universidades exclusivamente", "Cada establecimiento sin supervisión", "Los sindicatos docentes"], "La gestión privada se integra al sistema y queda sujeta a las autoridades jurisdiccionales.", 12], [3, "Según el artículo 104, ¿qué es la educación a distancia?", "Una opción pedagógica y didáctica aplicable a distintos niveles y modalidades", ["Un nivel educativo independiente", "Una modalidad exclusiva de universidades privadas", "Una actividad ajena a la política educativa"], "Puede integrarse tanto a la educación formal como a la no formal.", 14], [4, "¿Cuál es la función central del Consejo Federal de Educación según el artículo 116?", "Concertar, acordar y coordinar la política educativa nacional", ["Administrar directamente cada aula", "Otorgar todos los títulos universitarios", "Sustituir las autoridades provinciales"], "El CFE es un organismo interjurisdiccional permanente que procura la unidad y articulación del sistema.", 14], [4, "¿Qué regula el Estatuto del Docente de cada jurisdicción?", "Derechos, obligaciones, ingreso, evaluaciones y acceso a cargos", ["Solo los contenidos curriculares", "Exclusivamente la infraestructura escolar", "La organización de las universidades nacionales"], "Los estatutos enmarcan la carrera y las condiciones del trabajo docente.", 16], [4, "En Buenos Aires, ¿qué organismo conduce la administración educativa provincial según el texto?", "Dirección General de Cultura y Educación", ["Consejo de Universidades", "Congreso Pedagógico Nacional", "Ministerio de Economía nacional"], "El apunte describe a la DGCyE como organismo autárquico con rango ministerial.", 17], [4, "¿Qué es la institución educativa según la Ley de Educación Nacional citada en el apunte?", "La unidad pedagógica responsable de los procesos de enseñanza y aprendizaje", ["Una oficina dedicada solo a cuestiones presupuestarias", "Un organismo que sustituye al Estado provincial", "Una asociación exclusivamente administrativa"], "La definición destaca la responsabilidad pedagógica de la institución.", 14], [4, "¿Qué relación existe entre el marco normativo nacional y las leyes provinciales?", "Las provincias elaboran sus leyes para adecuar el sistema a sus realidades", ["Las provincias no pueden dictar leyes educativas", "Cada provincia debe ignorar el marco nacional", "Todas las escuelas redactan leyes nacionales"], "El material explica que las jurisdicciones elaboran sus propias leyes a partir del marco nacional.", 15]];const pictures=["<path d=\"M22 62h116M30 58V34l50-22 50 22v24M44 39v19m24-19v19m24-19v19m24-19v19\"/><circle cx=\"80\" cy=\"29\" r=\"5\"/>", "<rect x=\"18\" y=\"24\" width=\"43\" height=\"44\" rx=\"5\"/><rect x=\"99\" y=\"24\" width=\"43\" height=\"44\" rx=\"5\"/><path d=\"M67 46h26m-8-8 8 8-8 8M28 37h23M28 47h23M109 37h23M109 47h23\"/>", "<circle cx=\"80\" cy=\"42\" r=\"23\"/><circle cx=\"80\" cy=\"42\" r=\"9\"/><path d=\"M80 9v10m0 46v10M47 42H37m76 0h10M56 18l8 8m32 32 8 8m0-48-8 8M64 58l-8 8\"/>", "<path d=\"M80 27c-19-14-40-13-61-8v45c21-5 42-6 61 8 19-14 40-13 61-8V19c-21-5-42-6-61 8v45M31 34l33 4m-33 9 33 4m32-13 33-4m-33 17 33-4\"/>", "<circle cx=\"80\" cy=\"22\" r=\"11\"/><circle cx=\"39\" cy=\"47\" r=\"9\"/><circle cx=\"121\" cy=\"47\" r=\"9\"/><path d=\"M60 48c0-19 40-19 40 0M22 70c0-18 34-18 34 0m48 0c0-18 34-18 34 0M80 54v18\"/>"];const names=['Congreso Pedagógico','Reformas de los 90','Educación superior y técnica','Ley de Educación Nacional','Gestión y trabajo docente'];let questions=[],idx=0,score=0,streak=0,best=0,history=[],locked=false;const $=id=>document.getElementById(id);const screen=$('screen');function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function art(n){return `<div class="art" aria-hidden="true"><svg viewBox="0 0 160 84">${pictures[n]}</svg></div>`}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function intro(){$('hud').classList.add('hidden');screen.className='panel intro';screen.innerHTML=art(3)+`<div class="muted">MISIÓN DE APRENDIZAJE</div><h2>¿Cuánto sabés sobre las políticas educativas?</h2><p>Recorré cinco etapas de la historia y la normativa argentina. Respondé 20 preguntas, descubrí las explicaciones y sumá puntos.</p><p><b>100 puntos por respuesta correcta · 2.000 puntos posibles</b><br>Sin límite de tiempo. Los errores no descuentan puntos.</p><button class="primary" id="start">Comenzar desafío →</button>`;$('start').onclick=start}function start(){questions=names.flatMap((_,r)=>shuffle(raw.filter(q=>q[0]===r)));idx=0;score=0;streak=0;best=0;history=[];$('hud').classList.remove('hidden');render()}function hud(){ $('score').textContent=score.toLocaleString('es-AR');$('count').textContent=Math.min(idx+1,questions.length)+'/'+questions.length;$('streak').textContent=streak;$('bar').style.width=(history.length/questions.length*100)+'%';$('track').setAttribute('aria-valuenow',history.length);$('rounds').innerHTML=names.map((n,i)=>`<span class="chip ${idx<questions.length&&i===questions[idx][0]?'active':i<(questions[idx]?.[0]??5)?'done':''}">${i+1}. ${n}</span>`).join('')}function render(){locked=false;hud();let q=questions[idx];let opts=shuffle([q[2],...q[3]]);screen.className='panel animate';screen.innerHTML=art(q[0])+`<div class="muted">ETAPA ${q[0]+1} · ${names[q[0]]}</div><h2 tabindex="-1" id="question">${esc(q[1])}</h2><div class="options">${opts.map((x,i)=>`<button class="option" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div><div id="feedback" role="status" aria-live="polite"></div>`;screen.querySelectorAll('.option').forEach((b,i)=>b.onclick=()=>answer(q,opts,i));$('question').focus({preventScroll:true})}function answer(q,opts,i){if(locked)return;locked=true;let ok=opts[i]===q[2];if(ok){score+=100;streak++;best=Math.max(best,streak);if(streak%3===0)celebrate(16)}else streak=0;history.push({q,chosen:opts[i],ok});screen.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(opts[j]===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});hud();$('feedback').innerHTML=`<div class="feedback ${ok?'good':''}"><b>${ok?'✓ ¡Correcto! +100 puntos':'✕ Revisemos la respuesta'}</b><p>${esc(q[4])}</p><span class="muted">Material de estudio · pág. ${q[5]}</span></div><div class="actions"><span class="muted">${history.length} de ${questions.length} respuestas</span><button class="primary" id="next">${idx===questions.length-1?'Ver resultados':'Siguiente pregunta'} →</button></div>`;$('next').onclick=()=>{idx++;if(idx===questions.length)finish();else render()};$('next').focus({preventScroll:true})}function celebrate(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<n;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#dc730c','#205b46','#e7bb66'][i%3];e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),2300)}}function finish(){hud();let correct=history.filter(h=>h.ok).length;let pct=correct/questions.length*100;screen.className='panel result animate';screen.innerHTML=`<div class="muted">DESAFÍO COMPLETADO</div><h2>${pct>=80?'¡Excelente recorrido!':pct>=60?'¡Buen trabajo!':'¡Seguí practicando!'}</h2><div class="big">${score.toLocaleString('es-AR')} <small style="font-size:20px">/ 2.000</small></div><p>${correct} respuestas correctas de 20 · ${pct}% · Mejor racha: ${best}</p><div class="actions" style="justify-content:center"><button class="primary" id="again">Volver a jugar</button><button class="secondary" id="reviewBtn" aria-expanded="false">Revisar respuestas</button></div><div id="review" class="hidden">${history.map((h,i)=>`<div class="review"><b>${i+1}. ${h.ok?'✓':'✕'} ${esc(h.q[1])}</b><p>Tu respuesta: ${esc(h.chosen)}<br>Respuesta correcta: ${esc(h.q[2])}<br>${esc(h.q[4])} <span class="muted">(pág. ${h.q[5]})</span></p></div>`).join('')}</div>`;$('again').onclick=start;$('reviewBtn').onclick=()=>{let hidden=$('review').classList.toggle('hidden');$('reviewBtn').setAttribute('aria-expanded',!hidden);$('reviewBtn').textContent=hidden?'Revisar respuestas':'Ocultar revisión'};if(pct>=60)celebrate(50)}intro();</script></body></html>
